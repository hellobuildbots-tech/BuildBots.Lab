<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Save Robot City — Mission 3: The Traffic Light Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BUILDBOTS AI — MISSION 3: THE TRAFFIC LIGHT RESCUE
   Design system: "Neon Intersection"
   ============================================================ */
:root{
  --navy-950:#0a0e27;
  --navy-900:#0d1240;
  --navy-800:#131a52;
  --navy-700:#1b2468;
  --glass:rgba(255,255,255,0.06);
  --glass-brd:rgba(255,255,255,0.14);
  --cyan:#4dd8ff;
  --cyan-glow:#7ee8ff;
  --violet:#b07bff;
  --pink:#ff6ec9;
  --red:#ff4d5e;
  --red-dim:#7a2530;
  --yellow:#ffcb3d;
  --yellow-dim:#7a6420;
  --green:#33e08a;
  --green-dim:#1f6d47;
  --white:#f4f7ff;
  --ink-dim:#a6b0d8;
  --font-display:'Baloo 2', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  --font-body:'Quicksand', system-ui, sans-serif;
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-pop: 0 10px 0 rgba(0,0,0,0.25);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--white);
  background:
    radial-gradient(ellipse 80% 50% at 15% -10%, rgba(176,123,255,0.25), transparent 60%),
    radial-gradient(ellipse 70% 50% at 100% 10%, rgba(77,216,255,0.18), transparent 55%),
    radial-gradient(ellipse 60% 40% at 50% 110%, rgba(255,110,201,0.14), transparent 60%),
    linear-gradient(180deg, var(--navy-950), var(--navy-900) 40%, var(--navy-950));
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:focus-visible{outline:3px solid var(--cyan-glow); outline-offset:3px; border-radius:8px;}

/* ---------- background city skyline (fixed, decorative) ---------- */
.skyline{position:fixed; inset:auto 0 0 0; height:38vh; pointer-events:none; z-index:0; opacity:0.55;}
.skyline svg{width:100%;height:100%;display:block;}
.stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
.star{position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; opacity:0.5; animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:.8;}}

/* ---------- app shell ---------- */
#app{position:relative; z-index:1; max-width:920px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:14px 16px 110px;}

/* ---------- HUD ---------- */
#hud{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px;
  background:rgba(10,14,39,0.72); backdrop-filter:blur(14px);
  border:1px solid var(--glass-brd); border-radius:20px; padding:10px 14px; margin-bottom:16px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
}
.hud-mascot{width:38px !important; height:38px !important; min-width:38px; min-height:38px; flex-shrink:0;}
.hud-track{flex:1; display:flex; gap:5px; align-items:center;}
.hud-dot{
  flex:1; height:9px; border-radius:6px; background:rgba(255,255,255,0.12);
  position:relative; overflow:hidden; min-width:8px;
}
.hud-dot.done{background:linear-gradient(90deg,var(--green),#26c47a);}
.hud-dot.current{background:rgba(255,255,255,0.18);}
.hud-dot.current::after{
  content:''; position:absolute; inset:0; background:linear-gradient(90deg,var(--cyan),var(--violet));
  animation:pulseFill 1.6s ease-in-out infinite;
}
@keyframes pulseFill{0%,100%{opacity:.55;} 50%{opacity:1;}}
.hud-xp{
  display:flex; align-items:center; gap:6px; font-family:var(--font-display); font-weight:700;
  background:linear-gradient(135deg,#ffcb3d,#ff9f45); color:#3a2100; padding:6px 12px; border-radius:999px;
  font-size:14px; white-space:nowrap; box-shadow:0 3px 0 #b56d00;
}
#sound-toggle{
  background:var(--glass); border:1px solid var(--glass-brd); width:36px; height:36px; border-radius:50%;
  color:var(--white); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
#sound-toggle:hover{background:rgba(255,255,255,0.14);}

/* ---------- scene container ---------- */
#scene-wrap{flex:1; display:flex; flex-direction:column;}
.scene{animation:sceneIn .5s cubic-bezier(.2,.9,.25,1); display:flex; flex-direction:column; gap:18px;}
@keyframes sceneIn{from{opacity:0; transform:translateY(18px) scale(.985);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){
  .scene{animation:none;}
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}

.eyebrow{
  font-family:var(--font-display); font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  font-size:12px; color:var(--cyan-glow); display:flex; align-items:center; gap:8px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan-glow); box-shadow:0 0 8px var(--cyan-glow);}
h1.scene-title{
  font-family:var(--font-display); font-weight:800; font-size:clamp(24px,5.5vw,38px); margin:2px 0 0;
  line-height:1.05; background:linear-gradient(90deg,#fff,#cfe0ff); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.scene-goal{color:var(--ink-dim); font-size:15px; max-width:60ch; margin:0;}

/* ---------- glass card / panel ---------- */
.panel{
  background:var(--glass); border:1px solid var(--glass-brd); border-radius:var(--radius-lg);
  padding:20px; backdrop-filter:blur(10px); position:relative; overflow:hidden;
}
.panel::before{content:''; position:absolute; inset:0; background:linear-gradient(160deg, rgba(255,255,255,0.08), transparent 40%); pointer-events:none;}

/* ---------- speech bubble ---------- */
.bubble-row{display:flex; align-items:flex-end; gap:12px;}
.bubble{
  position:relative; background:#fff; color:#1a1b3a; font-family:var(--font-display); font-weight:600;
  border-radius:20px; padding:14px 18px; font-size:15.5px; line-height:1.35; max-width:440px;
  box-shadow:0 8px 0 rgba(0,0,0,0.15);
  min-height:1em;
}
.bubble::after{
  content:''; position:absolute; left:-9px; bottom:14px; width:0; height:0;
  border-top:9px solid transparent; border-bottom:9px solid transparent; border-right:12px solid #fff;
}
.bubble .cursor{display:inline-block; width:2px; height:1em; background:#1a1b3a; margin-left:2px; vertical-align:-2px; animation:blink 0.8s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--font-display); font-weight:700; font-size:15px; border:none; border-radius:16px;
  padding:13px 22px; cursor:pointer; color:#0a0e27; display:inline-flex; align-items:center; gap:8px;
  transition:transform .12s ease, box-shadow .12s ease; box-shadow:var(--shadow-pop);
}
.btn:active{transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.25);}
.btn:hover{transform:translateY(-2px);}
.btn:active:hover{transform:translateY(6px);}
.btn-primary{background:linear-gradient(135deg,var(--cyan),#3fa8ff); color:#04203a;}
.btn-glow{background:linear-gradient(135deg,#ffcb3d,#ff9f45); color:#3a2100;}
.btn-ghost{background:rgba(255,255,255,0.08); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.2); border:1px solid var(--glass-brd);}
.btn-green{background:linear-gradient(135deg,var(--green),#1ec97a); color:#04321c;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.btn-sm{padding:9px 16px; font-size:13.5px; border-radius:12px;}

/* ---------- nav bar (bottom) ---------- */
#navbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; justify-content:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, transparent, rgba(6,9,26,0.9) 30%);
}
#navbar .inner{
  width:100%; max-width:920px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}

/* ---------- Robot Byte mascot ---------- */
.mascot{display:block; max-width:100%; max-height:100%; height:auto;}
.bubble-row .mascot{width:64px; height:64px; flex-shrink:0;}
.mascot .antenna-ball{animation:bob 2.4s ease-in-out infinite;}
.mascot .eye{transform-origin:center;}
@keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
.mascot-float{animation:floaty 3.2s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-8px) rotate(1deg);}}

/* ---------- generic grids ---------- */
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:560px){.grid-3{grid-template-columns:1fr;} }

/* ---------- traffic light widget ---------- */
.tl-housing{
  background:#20233d; border-radius:22px; padding:16px 14px; display:flex; flex-direction:column; gap:12px;
  width:96px; margin:0 auto; box-shadow:inset 0 0 0 3px rgba(255,255,255,0.06), 0 10px 20px rgba(0,0,0,0.35);
}
.tl-lamp{
  width:64px; height:64px; border-radius:50%; margin:0 auto; background:#171a30;
  display:flex; align-items:center; justify-content:center; position:relative; transition:all .25s ease;
  border:3px solid rgba(255,255,255,0.05);
}
.tl-lamp.on-red{background:radial-gradient(circle at 40% 35%, #ff8f97, var(--red)); box-shadow:0 0 26px 8px rgba(255,77,94,0.75);}
.tl-lamp.on-yellow{background:radial-gradient(circle at 40% 35%, #ffe08a, var(--yellow)); box-shadow:0 0 26px 8px rgba(255,203,61,0.75);}
.tl-lamp.on-green{background:radial-gradient(circle at 40% 35%, #86ffc5, var(--green)); box-shadow:0 0 26px 8px rgba(51,224,138,0.75);}

/* color pick buttons (STOP/WAIT/GO) */
.color-btn{
  border:none; border-radius:20px; padding:18px 10px; font-family:var(--font-display); font-weight:800;
  font-size:15px; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px;
  box-shadow:var(--shadow-pop); transition:transform .12s;
}
.color-btn:active{transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.3);}
.color-btn .swatch{width:34px;height:34px;border-radius:50%; box-shadow:inset 0 -4px 6px rgba(0,0,0,0.25), 0 0 14px currentColor;}
.color-btn.red{background:linear-gradient(160deg,#ff6b78,var(--red)); box-shadow:0 8px 0 var(--red-dim);}
.color-btn.red:active{box-shadow:0 2px 0 var(--red-dim);}
.color-btn.yellow{background:linear-gradient(160deg,#ffe08a,var(--yellow)); color:#3a2900; box-shadow:0 8px 0 var(--yellow-dim);}
.color-btn.yellow:active{box-shadow:0 2px 0 var(--yellow-dim);}
.color-btn.green{background:linear-gradient(160deg,#7dffc0,var(--green)); box-shadow:0 8px 0 var(--green-dim);}
.color-btn.green:active{box-shadow:0 2px 0 var(--green-dim);}
.color-btn.wrong{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
.color-btn.correct-flash{animation:flashGood .5s;}
@keyframes flashGood{0%{box-shadow:0 0 0 0 #fff;} 50%{box-shadow:0 0 0 10px rgba(255,255,255,0);}}

/* road / robots for story + game scenes */
.road-scene{
  position:relative; height:180px; border-radius:20px; overflow:hidden;
  background:linear-gradient(180deg,#232a52,#171b39);
}
.road-scene svg{position:absolute; inset:0; width:100%; height:100%;}
.robot-chip{
  position:absolute; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:18px; box-shadow:0 4px 10px rgba(0,0,0,.4); transition:left 1s ease, top 1s ease, transform .3s;
}
.robot-chip.bump{animation:bump .5s;}
@keyframes bump{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-4px) rotate(-6deg);}75%{transform:translateX(4px) rotate(6deg);}}
.robot-chip.frozen{filter:saturate(.3);}
.robot-chip.slow{animation:wiggle 1.2s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:translateX(0);}50%{transform:translateX(3px);}}

/* flip cards (discussion) */
.flip-card{perspective:1000px; height:150px; cursor:pointer;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{
  position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; padding:16px;
  display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--font-display); font-weight:700; font-size:14.5px;
}
.flip-front{background:linear-gradient(150deg,var(--navy-700),var(--navy-800)); border:1px solid var(--glass-brd); color:var(--cyan-glow);}
.flip-back{background:linear-gradient(150deg,#2b3a8f,#1c2568); transform:rotateY(180deg); color:#fff; font-weight:600; font-size:13.5px;}

/* theory concept carousel */
.concept-card{min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;}
.concept-icon{font-size:46px;}
.concept-text{font-family:var(--font-display); font-weight:700; font-size:17px; max-width:36ch; line-height:1.3;}
.carousel-dots{display:flex; gap:6px; justify-content:center;}
.carousel-dots span{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,0.2);}
.carousel-dots span.active{background:var(--cyan-glow); box-shadow:0 0 8px var(--cyan-glow);}

/* drawing */
#draw-canvas{width:100%; aspect-ratio:4/3; background:#0f1330; border-radius:18px; border:1px solid var(--glass-brd); touch-action:none; display:block; cursor:crosshair;}
.palette{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.swatch-btn{width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,0.25); cursor:pointer; padding:0;}
.swatch-btn.active{border-color:#fff; transform:scale(1.15); box-shadow:0 0 0 3px rgba(255,255,255,0.25);}

/* hardware: circuit builder */
.breadboard{background:#152047; border-radius:20px; padding:20px; position:relative; border:1px solid var(--glass-brd);}
.led-slot{display:flex; flex-direction:column; align-items:center; gap:8px;}
.led-bulb{
  width:56px; height:56px; border-radius:50% 50% 8px 8px / 60% 60% 8px 8px; background:#2a2f52; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .2s; border:2px solid rgba(255,255,255,0.08);
  position:relative;
}
.led-bulb.lit-red{background:radial-gradient(circle at 35% 30%,#ffb0b8,var(--red)); box-shadow:0 0 24px 6px rgba(255,77,94,.8);}
.led-bulb.lit-yellow{background:radial-gradient(circle at 35% 30%,#fff0b0,var(--yellow)); box-shadow:0 0 24px 6px rgba(255,203,61,.8);}
.led-bulb.lit-green{background:radial-gradient(circle at 35% 30%,#b0ffd6,var(--green)); box-shadow:0 0 24px 6px rgba(51,224,138,.8);}
.wire{width:4px; height:34px; background:#525b8f; margin:0 auto; border-radius:2px;}
.wire.broken{background:repeating-linear-gradient(180deg,#ff4d5e 0 5px, transparent 5px 10px); animation:none; position:relative;}
.wire.broken::after{content:'✕'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--red); font-weight:900; font-size:14px;}
.wire.fixed-flash{animation:flashGood .6s;}
.led-label{font-family:var(--font-display); font-weight:700; font-size:12px; color:var(--ink-dim);}

/* mystery/debug banner */
.callout{
  display:flex; gap:10px; align-items:flex-start; background:rgba(255,203,61,0.1); border:1px solid rgba(255,203,61,0.35);
  border-radius:16px; padding:12px 14px; font-size:14px; color:#ffe6a8;
}

/* quiz */
.quiz-option{
  width:100%; text-align:left; background:var(--glass); border:1px solid var(--glass-brd); color:#fff; border-radius:14px;
  padding:13px 16px; font-family:var(--font-body); font-weight:600; font-size:14.5px; cursor:pointer; transition:all .15s;
  display:flex; align-items:center; gap:10px;
}
.quiz-option:hover{background:rgba(255,255,255,0.12);}
.quiz-option.correct{background:rgba(51,224,138,0.25); border-color:var(--green);}
.quiz-option.incorrect{background:rgba(255,77,94,0.22); border-color:var(--red);}
.quiz-option:disabled{cursor:default;}

/* badge / celebration */
.badge-medal{
  width:130px; height:130px; margin:0 auto; border-radius:50%;
  background:conic-gradient(from 180deg, #ffcb3d, #ff9f45, #ffcb3d);
  display:flex; align-items:center; justify-content:center; font-size:56px;
  box-shadow:0 0 0 8px rgba(255,203,61,0.15), 0 12px 30px rgba(255,155,20,0.4);
  animation:medalPop .6s cubic-bezier(.2,1.4,.4,1);
}
@keyframes medalPop{0%{transform:scale(0) rotate(-30deg);} 70%{transform:scale(1.15) rotate(8deg);} 100%{transform:scale(1) rotate(0);}}
canvas#confetti-canvas{position:fixed; inset:0; z-index:200; pointer-events:none;}

.certificate{
  border:3px dashed rgba(255,255,255,0.35); border-radius:22px; padding:24px; text-align:center;
  background:linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
}
.certificate .name-line{
  font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--cyan-glow);
  border-bottom:2px solid var(--glass-brd); display:inline-block; padding:4px 20px; margin:8px 0;
}
input.name-input{
  background:transparent; border:none; border-bottom:2px solid var(--cyan-glow); text-align:center; color:#fff;
  font-family:var(--font-display); font-size:20px; font-weight:700; padding:4px 8px; width:220px; max-width:70vw;
}
input.name-input::placeholder{color:rgba(255,255,255,0.4);}

/* homework card */
.homework-card{background:linear-gradient(160deg,#2b2560,#171a3d); border:1px solid var(--glass-brd); border-radius:24px; padding:22px; position:relative; overflow:hidden;}
.homework-tag{position:absolute; top:16px; right:-34px; background:var(--pink); color:#3a0022; font-family:var(--font-display); font-weight:800; font-size:12px; padding:5px 40px; transform:rotate(35deg); box-shadow:0 3px 8px rgba(0,0,0,.3);}

/* mini objective chip */
.obj-chip{display:inline-flex; align-items:center; gap:6px; background:rgba(77,216,255,0.12); border:1px solid rgba(77,216,255,0.3); color:var(--cyan-glow); font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px;}

/* signal creator */
.signal-picker{display:flex; gap:10px; flex-wrap:wrap;}
.signal-swatch{width:44px;height:44px;border-radius:12px; cursor:pointer; border:3px solid transparent;}
.signal-swatch.active{border-color:#fff; transform:scale(1.08);}
.custom-card{background:var(--glass); border:1px solid var(--glass-brd); border-radius:16px; padding:14px; display:flex; gap:12px; align-items:center;}
.custom-card .cs-dot{width:34px;height:34px;border-radius:50%; flex-shrink:0; box-shadow:0 0 12px currentColor;}

/* live region */
#announcer{position:absolute; width:1px;height:1px; overflow:hidden;}

/* toast */
#toast{
  position:fixed; left:50%; top:18px; transform:translate(-50%,-140%); z-index:300;
  background:#fff; color:#1a1b3a; font-family:var(--font-display); font-weight:700; font-size:14px;
  padding:10px 18px; border-radius:14px; box-shadow:0 10px 24px rgba(0,0,0,.35); transition:transform .35s cubic-bezier(.2,1,.3,1);
  display:flex; align-items:center; gap:8px;
}
#toast.show{transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div class="skyline" aria-hidden="true">
  <svg viewBox="0 0 800 200" preserveAspectRatio="none">
    <rect x="0" y="90" width="60" height="110" fill="#171b3d"/>
    <rect x="70" y="60" width="45" height="140" fill="#1b2050"/>
    <rect x="125" y="110" width="70" height="90" fill="#171b3d"/>
    <rect x="205" y="40" width="50" height="160" fill="#1e2456"/>
    <rect x="265" y="85" width="60" height="115" fill="#171b3d"/>
    <rect x="335" y="20" width="55" height="180" fill="#232a5e"/>
    <rect x="400" y="95" width="65" height="105" fill="#171b3d"/>
    <rect x="475" y="55" width="48" height="145" fill="#1b2050"/>
    <rect x="533" y="100" width="70" height="100" fill="#171b3d"/>
    <rect x="613" y="30" width="52" height="170" fill="#1e2456"/>
    <rect x="675" y="80" width="60" height="120" fill="#171b3d"/>
    <rect x="745" y="115" width="55" height="85" fill="#1b2050"/>
    <g fill="#4dd8ff" opacity="0.55">

/* ============================================================
   AUDIO — tiny WebAudio synth, no external files
   ============================================================ */
let actx=null, soundOn=true;
function ensureAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended'){ actx.resume(); }
  return actx;
}
function tone(freq,dur,type,vol,delay){
  if(!soundOn) return;
  const ctx=ensureAudio(); if(!ctx) return;
  const t0=ctx.currentTime+(delay||0);
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol||0.14,t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
const sfx={
  click:()=>tone(520,.09,'triangle',.12),
  pop:()=>{tone(660,.08,'square',.08); tone(880,.09,'square',.06,.04);},
  success:()=>{tone(523,.12,'sine',.16); tone(659,.12,'sine',.14,.1); tone(784,.18,'sine',.16,.2);},
  error:()=>{tone(220,.16,'sawtooth',.12); tone(160,.2,'sawtooth',.1,.08);},
  whoosh:()=>tone(200,.25,'sine',.06),
  fanfare:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.15,i*0.11));}
};
document.getElementById('sound-toggle').addEventListener('click',function(){

});

}

function updateNav(){
  document.getElementById('prevBtn').style.visibility = state.scene===0?'hidden':'visible';

function goto(i){

    init(){
      const canvas=document.getElementById('draw-canvas');
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#0f1330'; ctx.fillRect(0,0,canvas.width,canvas.height);
      let drawing=false, color='#ff4d5e';
      function pos(e){
        const r=canvas.getBoundingClientRect();
        const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
        const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
        return {x:cx*(canvas.width/r.width), y:cy*(canvas.height/r.height)};
      }
      function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
      function move(e){ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle=color; ctx.lineWidth=8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); state.drawnStrokes=true; e.preventDefault(); }
      function end(){ if(drawing){drawing=false; sfx.click();} }
      canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
      canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
      document.querySelectorAll('.swatch-btn').forEach(b=>{

function typeInto(el, text, speed, done){
  if(!el) return;
  let i=0;
  el.innerHTML='';
  const span=document.createElement('span'); el.appendChild(span);
  const cursor=document.createElement('span'); cursor.className='cursor'; el.appendChild(cursor);
  const timer=setInterval(()=>{
    span.textContent = text.slice(0,i+1);
    i++;
    if(i%3===0) sfx.click();
    if(i>=text.length){ clearInterval(timer); cursor.remove(); if(done) done(); }
  },speed);
}

/* ============================================================
   CONFETTI
   ============================================================ */
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  const ctx=canvas.getContext('2d');
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  resize();
  const colors=['#ff4d5e','#ffcb3d','#33e08a','#4dd8ff','#b07bff','#ff6ec9'];
  const pieces=Array.from({length:110},()=> ({
    x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*0.5,
    r:4+Math.random()*5, c:colors[Math.floor(Math.random()*colors.length)],
    vy:2+Math.random()*3, vx:-1.5+Math.random()*3, rot:Math.random()*360, vr:-6+Math.random()*12
  }));
  let frame=0, maxFrames=280;
  (function anim(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      ctx.restore();
    });
    if(frame<maxFrames) requestAnimationFrame(anim);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  })();
}

  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;

  if(e.key==='ArrowLeft'){ document.getElementById('prevBtn').click(); }
});

})();
</script>
</body>
</html>
