<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  .robot-stage {
    width: 340px;
    height: 400px;
    position: relative;
  }

  /* centering fix: flex column + align-items:center keeps every
     part locked to the same vertical axis regardless of its width */
  .robot {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: float 3.4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
    50%      { transform: translate(-50%, -50%) translateY(-10px); }
  }

  .antenna {
    width: 5px;
    height: 26px;
    background: linear-gradient(180deg, #aab4bb, #7c8790);
    border-radius: 3px;
    position: relative;
  }

  .antenna-ball {
    width: 13px;
    height: 13px;
    background: #4fd1ff;
    border-radius: 50%;
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px 2px rgba(79, 209, 255, 0.75);
    animation: blink-light 1.8s ease-in-out infinite;
  }

  @keyframes blink-light {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---- head / sensor cluster ---- */

  .head {
    width: 168px;
    height: 128px;
    background: linear-gradient(155deg, #f1f4f6 0%, #cfd8dd 55%, #b7c2c8 100%);
    border-radius: 26px;
    border: 3px solid #97a3aa;
    position: relative;
    margin-top: 4px;
    box-shadow:
      inset 0 -10px 16px rgba(0,0,0,0.06),
      0 3px 6px rgba(0,0,0,0.08);
  }

  .screw {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #dfe5e8, #8a97a0 70%);
    position: absolute;
    box-shadow: inset 0 0 1px rgba(0,0,0,0.4);
  }
  .screw.tl { top: 8px; left: 8px; }
  .screw.tr { top: 8px; right: 8px; }
  .screw.bl { bottom: 8px; left: 8px; }
  .screw.br { bottom: 8px; right: 8px; }

  /* twin ultrasonic distance sensor, mounted above the visor */
  .ultrasonic {
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 2;
  }

  .ultrasonic-cap {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eef2f4, #9aa6ac 75%);
    border: 2px solid #7c8790;
  }

  /* visor housing the camera-style eyes */
  .visor {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 52px;
    background: #202a31;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
  }

  .eye {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #dff7ff, #5fc6e8 45%, #1b6f8c 78%, #0c3b4c 100%);
    position: relative;
    box-shadow: 0 0 6px rgba(95, 198, 232, 0.55);
    animation: blink 5s ease-in-out infinite;
  }
  .eye.right { animation-delay: 0.2s; }

  .eye::after {
    content: "";
    position: absolute;
    top: 6px;
    left: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
  }

  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.15); }
  }

  /* small IR proximity sensor slit under the visor */
  .ir-sensor {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 6px;
    background: #b23b3b;
    border-radius: 3px;
    opacity: 0.85;
  }

  .neck {
    width: 20px;
    height: 10px;
    background: #97a3aa;
    border-radius: 3px;
  }

  /* ---- body / control panel ---- */

  .body {
    width: 200px;
    height: 138px;
    background: linear-gradient(155deg, #fbfcfd 0%, #dde5e8 60%, #c6cfd4 100%);
    border-radius: 24px;
    border: 3px solid #97a3aa;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      inset 0 -12px 18px rgba(0,0,0,0.05),
      0 4px 8px rgba(0,0,0,0.08);
  }

  .panel {
    width: 110px;
    height: 74px;
    background: #202a31;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
  }

  .panel-row {
    display: flex;
    gap: 10px;
  }

  .led {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .led.g { background: #57e389; box-shadow: 0 0 6px #57e389; }
  .led.y { background: #ffd76f; box-shadow: 0 0 6px #ffd76f; animation-delay: 0.3s; }
  .led.r { background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b; animation-delay: 0.6s; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  .panel-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
  }
  .panel-bars span {
    width: 4px;
    background: #4fd1ff;
    border-radius: 1px;
    animation: eq 1.2s ease-in-out infinite;
  }
  .panel-bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .panel-bars span:nth-child(2) { height: 80%; animation-delay: 0.15s; }
  .panel-bars span:nth-child(3) { height: 55%; animation-delay: 0.3s; }
  .panel-bars span:nth-child(4) { height: 90%; animation-delay: 0.45s; }
  .panel-bars span:nth-child(5) { height: 35%; animation-delay: 0.6s; }

  @keyframes eq {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.4); }
  }

  .arm {
    width: 13px;
    height: 46px;
    background: linear-gradient(180deg, #cfd8dd, #97a3aa);
    border-radius: 6px;
    position: absolute;
    top: 26px;
    border: 2px solid #8a97a0;
  }
  .arm.left { left: -18px; }
  .arm.right { right: -18px; }

  .feet {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .foot {
    width: 30px;
    height: 12px;
    background: linear-gradient(180deg, #cfd8dd, #97a3aa);
    border-radius: 6px;
    border: 2px solid #8a97a0;
  }
</style>
</head>
<body>

<div class="robot-stage">
  <div class="robot">
    <div class="antenna">
      <div class="antenna-ball"></div>
    </div>

    <div class="head">
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>

      <div class="ultrasonic">
        <div class="ultrasonic-cap"></div>
        <div class="ultrasonic-cap"></div>
      </div>

      <div class="visor">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>

      <div class="ir-sensor"></div>
    </div>

    <div class="neck"></div>

    <div class="body">
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="panel">
        <div class="panel-row">
          <div class="led g"></div>
          <div class="led y"></div>
          <div class="led r"></div>
        </div>
        <div class="panel-bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="feet">
      <div class="foot"></div>
      <div class="foot"></div>
    </div>
  </div>
</div>

</body>
</html>
