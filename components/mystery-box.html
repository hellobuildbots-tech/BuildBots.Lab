<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Mystery Box</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; font-family:sans-serif; color:#fff; text-align:center; }
  .box { font-size: 100px; cursor: pointer; animation: pulse 1.5s infinite; }

</head>
<body>
<div class="box" onclick="alert('🎁 Unlocked LED Light!')">🎁</div>
<p>Tap the Mystery Box!</p>
</body>
</html>
