<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Sensor Visualizer</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; color:#fff; text-align:center; }
  .wave { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #3FE0FF; margin: 0 auto; animation: ripple 1.5s infinite; }
  @keyframes ripple { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
</style>
</head>
<body>
<div class="wave"></div>
<p>Ultrasonic Distance Waves</p>
</body>
</html>
