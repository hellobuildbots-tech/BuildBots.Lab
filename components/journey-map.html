<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BuildBots AI — Journey Map Component</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 40px; background: #0F172A; font-family: 'Fredoka', sans-serif; color: #FFF; text-align: center; }
  .map-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .node {
    width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 32px; background: rgba(255,255,255,0.15); border: 4px solid rgba(255,255,255,0.3); cursor: pointer; transition: transform 0.2s;
  }
  .node.active { background: #7ED957; border-color: #FFF; box-shadow: 0 0 24px #7ED957; transform: scale(1.15); }
  .node.locked { opacity: 0.5; cursor: not-allowed; }
  .path-line { width: 6px; height: 40px; background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<h1>🗺️ ROBOTICS ADVENTURE MAP</h1>
<div class="map-container">
  <div class="node active">1</div>
  <div class="path-line"></div>
  <div class="node active">2</div>
  <div class="path-line"></div>
  <div class="node locked">🔒 3</div>
  <div class="path-line"></div>
  <div class="node locked">🔒 4</div>
</div>
</body>
</html>
