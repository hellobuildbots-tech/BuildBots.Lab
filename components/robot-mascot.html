<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildBots AI — Robot Mascot Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --blue: #1E6FFF; --cyan: #3FE0FF; --yellow: #FFD23F; }
  body { margin: 0; padding: 40px; background: #0F172A; font-family: 'Fredoka', sans-serif; color: #FFF; text-align: center; }
  .mascot-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
  .speech-bubble {
    background: #FFF; color: #0F172A; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 20px;
    padding: 14px 24px; border-radius: 24px; border-bottom-right-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 16px; max-width: 280px;
    animation: float 2.5s infinite ease-in-out;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .robot-svg { width: 140px; height: 140px; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5)); transition: transform 0.3s; }
  .controls { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 10px 18px; border-radius: 999px; border: none; font-weight: 700; background: var(--cyan); color: #0F172A; cursor: pointer; }
</style>
</head>
<body>
<div class="mascot-stage">
  <div class="speech-bubble" id="boltBubble">Hello! I am Bolt!</div>
  <svg class="robot-svg" id="boltSvg" viewBox="0 0 100 100">
    <ellipse cx="50" cy="30" rx="4" ry="10" fill="#3FE0FF"/>
    <circle cx="50" cy="16" r="6" fill="#FFD23F"/>
    <rect x="20" y="34" width="60" height="52" rx="26" fill="#3FE0FF" stroke="#1E6FFF" stroke-width="3"/>
    <circle id="eyeL" cx="38" cy="58" r="9" fill="#FFF"/>
    <circle id="eyeR" cx="62" cy="58" r="9" fill="#FFF"/>
    <circle cx="38" cy="58" r="4" fill="#1E6FFF"/>
    <circle cx="62" cy="58" r="4" fill="#1E6FFF"/>
    <path id="mouth" d="M32 76 Q50 86 68 76" stroke="#1E6FFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="controls">
    <button class="btn" onclick="setExpression('happy', 'Awesome job!')">Happy</button>
    <button class="btn" onclick="setExpression('think', 'Hmm... let me see...')">Think</button>
    <button class="btn" onclick="setExpression('sleep', 'Zzz... battery low...')">Sleep</button>
    <button class="btn" onclick="setExpression('celebrate', 'WE WON! YAAY!')">Celebrate</button>
  </div>
</div>

<script>
function setExpression(state, text) {
  document.getElementById('boltBubble').textContent = text;
  const svg = document.getElementById('boltSvg');
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const mouth = document.getElementById('mouth');

  if (state === 'happy') {
    svg.style.transform = 'scale(1.1) rotate(5deg)';
    eyeL.setAttribute('fill', '#FFF'); eyeR.setAttribute('fill', '#FFF');
    mouth.setAttribute('d', 'M32 76 Q50 86 68 76');
  } else if (state === 'think') {
    svg.style.transform = 'translateY(-10px)';
    mouth.setAttribute('d', 'M35 78 Q50 78 65 78');
  } else if (state === 'sleep') {
    svg.style.transform = 'translateY(10px) scale(0.95)';
    eyeL.setAttribute('fill', '#64748B'); eyeR.setAttribute('fill', '#64748B');
    mouth.setAttribute('d', 'M38 80 Q50 72 62 80');
  } else if (state === 'celebrate') {
    svg.style.transform = 'scale(1.2) rotate(-10deg)';
    mouth.setAttribute('d', 'M30 74 Q50 90 70 74');
  }
}
</script>
</body>
</html>
