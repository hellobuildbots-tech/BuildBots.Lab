<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Electricity Flow</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; }
  .wire-line { height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; position: relative; overflow: hidden; }
  .electron { width: 14px; height: 14px; background: #FFD23F; border-radius: 50%; position: absolute; top: -1px; box-shadow: 0 0 10px #FFD23F; animation: move 2s linear infinite; }
  @keyframes move { 0% { left: 0%; } 100% { left: 100%; } }
</style>
</head>
<body>
<div class="wire-line">
  <div class="electron"></div>
</div>
</body>
</html>
