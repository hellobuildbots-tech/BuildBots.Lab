<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Switch Simulator</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; font-family:sans-serif; color:#fff; }
  .switch-btn { width: 120px; height: 60px; background: #FF4757; border-radius: 999px; border: none; cursor: pointer; color: #fff; font-weight: bold; font-size: 20px; transition: background 0.3s; }
  .switch-btn.on { background: #7ED957; }
</style>
</head>
<body>
<button class="switch-btn" id="sw" onclick="this.classList.toggle('on'); this.textContent = this.classList.contains('on') ? 'ON' : 'OFF';">OFF</button>
</body>
</html>
