<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Robot Command Console</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; text-align:center; }
  .btn { padding: 12px 24px; margin: 5px; border-radius: 999px; border: none; background: #FFD23F; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div style="font-size:80px;" id="bot">🤖</div>
<button class="btn" onclick="document.getElementById('bot').style.transform='rotate(360deg)'">Rotate</button>
<button class="btn" onclick="document.getElementById('bot').style.transform='translateY(-20px)'">Jump</button>
</body>
</html>
