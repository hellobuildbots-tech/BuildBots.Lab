<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Wire Drawing Tool</title>
<style>
  body { margin:0; padding:20px; background:#0F172A; }
  canvas { background: rgba(255,255,255,0.05); border-radius: 20px; border: 2px solid #3FE0FF; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="wireCanvas" width="600" height="350"></canvas>
<script>
  const cvs = document.getElementById('wireCanvas');
  const ctx = cvs.getContext('2d');
  let drawing = false, startX, startY;
  cvs.onmousedown = (e) => { drawing = true; startX = e.offsetX; startY = e.offsetY; };
  cvs.onmousemove = (e) => {
    if(!drawing) return;
    ctx.clearRect(0,0,600,350);
    ctx.beginPath(); ctx.strokeStyle = '#FF8C42'; ctx.lineWidth = 6;
    ctx.moveTo(startX, startY); ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
  };
  cvs.onmouseup = () => drawing = false;
</script>
</body>
</html>
