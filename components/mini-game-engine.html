<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Mini Game Engine</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; color:#fff; text-align:center; }
</style>
</head>
<body>
<h2>⏱️ Time Remaining: <span id="timer">10</span>s</h2>
<h3>Score: <span id="score">0</span></h3>
<button style="padding:15px 30px; border-radius:999px; border:none; background:#7ED957; font-weight:bold; font-size:20px;" onclick="document.getElementById('score').textContent = parseInt(document.getElementById('score').textContent) + 10;">TAP FAST!</button>
</body>
</html>
