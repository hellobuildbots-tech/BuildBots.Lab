<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Traffic Light</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; text-align:center; }
  .box { width: 70px; padding: 15px; background: #1E293B; border-radius: 20px; display: inline-block; }
  .light { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); margin: 10px 0; }
  .red.on { background: #FF4757; box-shadow: 0 0 20px #FF4757; }
  .yellow.on { background: #FFD23F; box-shadow: 0 0 20px #FFD23F; }
  .green.on { background: #7ED957; box-shadow: 0 0 20px #7ED957; }
</style>
</head>
<body>
<div class="box">
  <div class="light red on"></div>
  <div class="light yellow"></div>
  <div class="light green"></div>
</div>
</body>
</html>
