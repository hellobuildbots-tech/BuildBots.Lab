<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Flashlight Beam</title>
<style>
  body { margin:0; padding:0; height:100vh; background:#000; overflow:hidden; cursor:none; }
  .beam { width: 250px; height: 250px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 70%); position: absolute; pointer-events: none; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="beam" id="beam"></div>
<script>
  document.onmousemove = (e) => {
    document.getElementById('beam').style.left = e.clientX + 'px';
    document.getElementById('beam').style.top = e.clientY + 'px';
  };
</script>
</body>
</html>
