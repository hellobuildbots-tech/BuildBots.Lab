<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildBots AI — Component Library Core & CSS/JS System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1E6FFF;
    --cyan: #3FE0FF;
    --yellow: #FFD23F;
    --lime: #7ED957;
    --orange: #FF8C42;
    --purple: #9B5DE5;
    --pink: #FF6584;
    --red: #FF4757;
    --dark-bg: #0F172A;
    --card-bg: rgba(255, 255, 255, 0.14);
    --card-border: rgba(255, 255, 255, 0.28);
    --radius: 28px;
    --shadow: 0 20px 40px rgba(0, 0, 30, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: 'Fredoka', 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1E3B8A 0%, #4C1D95 50%, #0F172A 100%);
    color: #FFFFFF; min-height: 100vh;
  }

  /* Global Animations */
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pulseGlow { 0%, 100% { filter: drop-shadow(0 0 10px var(--cyan)); } 50% { filter: drop-shadow(0 0 25px var(--yellow)); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  @keyframes bouncePop { 0% { transform: scale(0.8); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

  .buildbots-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 2px solid var(--card-border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 32px; margin-bottom: 24px;
  }

  .buildbots-btn {
    font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 18px;
    padding: 14px 28px; border-radius: 999px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: #3A1C00; box-shadow: 0 8px 20px rgba(255, 140, 66, 0.4);
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .buildbots-btn:hover { transform: scale(1.06) translateY(-2px); box-shadow: 0 12px 28px rgba(255, 140, 66, 0.6); }
  .buildbots-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div class="buildbots-card">
  <h1>🤖 BuildBots AI Component Core Ready</h1>
  <p>Shared CSS and Web Audio API engine initialized for all 35 modular components.</p>
</div>

<script>
// BuildBots Web Audio Engine
class BuildBotsAudio {
  constructor() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  }

  play(type) {
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    const now = this.ctx.currentTime;

    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(174.61, now + 0.15);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'unlock') {
      osc.type = 'triangle';
      [440, 554.37, 659.25, 880].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.08));
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    }
  }
}
window.buildbotsAudio = new BuildBotsAudio();
</script>
</body>
</html>
