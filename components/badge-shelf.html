<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Badge Shelf</title>
<style>
  body { margin:0; padding:40px; background:#0F172A; font-family:sans-serif; color:#fff; }
  .shelf { display: flex; gap: 16px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; }
  .badge-item { font-size: 40px; padding: 10px; background: rgba(255,255,255,0.2); border-radius: 50%; }
</style>
</head>
<body>
<h2>🏅 TROPHY SHELF</h2>
<div class="shelf">
  <div class="badge-item">🥇</div>
  <div class="badge-item">🚀</div>
  <div class="badge-item">🔋</div>
  <div class="badge-item">🛠️</div>
</div>
</body>
</html>
